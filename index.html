<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya AI</title>

<!-- Marked library to format AI responses without Markdown asterisks -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070707;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative
}

.spark{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:150px;
  opacity:.08;
  pointer-events:none
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2
}

/* Three dots menu button */
.menu-btn {
  position: absolute;
  left: 15px;
  background: transparent;
  border: none;
  color: #ffd900;
  font-size: 28px;
  cursor: pointer;
  width: auto;
  height: auto;
  z-index: 10;
}

/* Warning pointer box pointing to three dots */
.warning-box {
  position: absolute;
  top: 65px;
  left: 10px;
  background: #2b0000;
  border: 2px solid #ff3333;
  color: #ff3333;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: bold;
  z-index: 20;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
  animation: pulse 1.5s infinite alternate;
  max-width: 250px;
}

.warning-box::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 12px;
  border-width: 0 8px 10px 8px;
  border-style: solid;
  border-color: transparent transparent #ff3333 transparent;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.03); }
}

h1{
  margin:0;
  color:#ffd900;
  font-size:24px;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:title 2s steps(19) forwards
}

@keyframes title{
  to{width:250px}
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
  position:relative;
  z-index:1
}

.msg{
  max-width:82%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:18px;
  line-height:1.45;
  word-wrap:break-word
}

.msg p {
  margin: 0 0 8px 0;
}
.msg p:last-child {
  margin-bottom: 0;
}

.user{
  background:#333;
  margin-left:auto
}

.bot{
  background:#181818;
  border:1px solid #444
}

.warning{
  background:#2b2100;
  border:2px solid #ffd900;
  color:#ffd900;
  text-align:center;
  font-weight:bold
}

.thinking{
  color:#aaa;
  padding:10px;
  font-family:Arial, sans-serif;
}

.bottom{
  padding:10px;
  background:#101010;
  display:flex;
  gap:7px;
  z-index:5
}

button{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:white;
  font-size:20px;
  cursor:pointer
}

button:active{
  transform:scale(.92)
}

input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  border-radius:25px;
  padding:0 16px;
  font-size:16px
}

.search{
  background:#ffd900;
  color:#000
}

#photo{
  display:none
}

.preview{
  position:fixed;
  bottom:75px;
  left:10px;
  max-width:120px;
  max-height:120px;
  border-radius:12px;
  display:none;
  z-index:10
}

/* Fullscreen Real-Style Hacking Overlay */
.hack-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 9999;
  flex-direction: column;
  padding: 20px;
  font-family: 'Courier New', Courier, monospace;
  color: #00ff00;
  overflow: hidden;
}

.hack-header {
  font-size: 22px;
  font-weight: bold;
  color: #00ff00;
  text-shadow: 0 0 8px #00ff00;
  margin-bottom: 10px;
  text-align: center;
  border-bottom: 1px solid #00ff00;
  padding-bottom: 8px;
}

.hack-log {
  flex: 1;
  font-size: 14px;
  overflow-y: auto;
  line-height: 1.5;
  margin-bottom: 15px;
  white-space: pre-wrap;
}

.hack-status-box {
  border: 1px solid #00ff00;
  padding: 10px;
  background: rgba(0, 255, 0, 0.05);
}

.progress-bar-container {
  width: 100%;
  background: #111;
  border: 1px solid #00ff00;
  height: 20px;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 6px;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #00ff00;
  box-shadow: 0 0 10px #00ff00;
  transition: width 0.1s linear;
}
</style>
</head>

<body>

<div class="app">

  <div class="spark">✨</div>

  <header>
    <button class="menu-btn" onclick="startHackMode()" title="Options">⋮</button>
    
    <!-- Warning box pointing at menu button -->
    <div class="warning-box">
      ▲ DONT CLICK HERE IF YOU LOVE YOUR DEVICE, THANKYOU FOR READING.
    </div>

    <h1>Powered by Aditya Sir</h1>
  </header>

  <div id="chat" class="chat"></div>

  <div class="bottom">
    <button onclick="mic()" title="Microphone">🎙️</button>

    <button onclick="document.getElementById('photo').click()" title="Photo">
      📷
    </button>

    <input
      id="input"
      placeholder="Ask anything..."
      autocomplete="off"
    >

    <button class="search" onclick="send()" title="Search">
      🔍
    </button>

    <input id="photo" type="file" accept="image/*">
  </div>

  <img id="preview" class="preview">

</div>

<!-- Real Formate Hacking Overlay -->
<div id="hackOverlay" class="hack-overlay">
  <div class="hack-header">HACKING BY ADITYA...</div>
  <div id="hackLog" class="hack-log"></div>
  <div class="hack-status-box">
    <div id="progressText">INITIALIZING SYSTEM EXPLOIT... 0%</div>
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>
</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const photo = document.getElementById("photo");
const preview = document.getElementById("preview");

function add(text, type="bot", warning=false){
  const d = document.createElement("div");
  d.className = "msg " + type + (warning ? " warning" : "");

  // Render Markdown formatting properly for bot replies
  if (type === "bot" && !warning && typeof marked !== "undefined") {
    d.innerHTML = marked.parse(text);
  } else {
    d.textContent = text;
  }

  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function thinking(){
  const d = document.createElement("div");
  d.id = "thinking";
  d.className = "thinking";
  d.textContent = "🤖 Thinking...";
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function removeThinking(){
  const d = document.getElementById("thinking");
  if(d) d.remove();
}

async function send(){
  const q = input.value.trim();
  if(!q) return;

  add(q, "user");
  input.value = "";

  const x = q.toLowerCase().trim();

  /* SPECIAL ADITYA MESSAGE */
  if(x.includes("aditya")){
    add("⚠️ Welcome to the Unwanted AI chatbot And Please (don't) Visit Again!!", "bot", true);
    return;
  }

  /* WHO ARE YOU? */
  if(x === "who are you" || x === "who are you?" || x.includes("who are you")){
    add("Tell who are you, Girl or Boy.");
    return;
  }

  /* BOY ANSWER */
  if(x === "boy" || x === "i am a boy" || x.includes("answer is boy")){
    add("So I have to give a meaningful sentence, OK then I am an AI assistant developed by Aditya Sir. I can answer questions, explain lessons, solve problems, help with coding, and help you with many other tasks.");
    return;
  }

  /* WHO BUILT YOU? */
  if(x.includes("who built you") || x.includes("who made you") || x.includes("who created you") || x.includes("who developed you")){
    add("I was built by a great personality, Aditya Singh in the year 2026.");
    return;
  }

  /* DEVELOPMENT QUESTIONS */
  if(
    x.includes("develop this chatbot") ||
    x.includes("developed this chatbot") ||
    x.includes("development of this chatbot") ||
    x.includes("make this chatbot") ||
    x.includes("making this chatbot") ||
    x.includes("build this chatbot") ||
    x.includes("building this chatbot") ||
    x.includes("create this chatbot") ||
    x.includes("creating this chatbot")
  ){
    add("I was developed by a great Personality Aditya Sir.");
    return;
  }

  /* NORMAL AI QUESTION */
  thinking();

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q })
    });

    const data = await response.json();
    removeThinking();

    if(data.reply){
      add(data.reply);
    } else {
      add("❌ Sorry, I could not answer that.");
    }
  } catch(error){
    removeThinking();
    add("❌ Connection error. Please make sure the server is running.");
  }
}

input.addEventListener("keydown", e => {
  if(e.key === "Enter") send();
});

/* MICROPHONE */
function mic(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    add("🎙️ Your browser does not support voice input.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.start();

  recognition.onstart = () => { input.placeholder = "🎙️ Listening..."; };
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    input.placeholder = "Ask anything...";
  };
  recognition.onerror = () => { input.placeholder = "Ask anything..."; };
}

/* PHOTO PREVIEW */
photo.onchange = () => {
  const file = photo.files[0];
  if(!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
};

/* REAL-STYLE HACKING ANIMATION */
function startHackMode(){
  const overlay = document.getElementById("hackOverlay");
  const log = document.getElementById("hackLog");
  const bar = document.getElementById("progressBar");
  const text = document.getElementById("progressText");

  overlay.style.display = "flex";
  log.innerHTML = "";
  bar.style.width = "0%";
  text.textContent = "HACKING BY ADITYA... 0%";

  let currentPercent = 0;

  const terminalLogs = [
    "[INIT] Connecting to remote terminal interface...",
    "[EXPLOIT] Injecting shellcode into memory buffer...",
    "[SECURITY] Bypassing localized device firewall...",
    "[DATA] Reading stored local memory blocks...",
    "[SYSTEM] Decrypting system security tokens...",
    "[OVERRIDE] Master access request sent to host..."
  ];

  function appendLogLine(message) {
    log.innerHTML += message + "\n";
    log.scrollTop = log.scrollHeight;
  }

  appendLogLine("[SYSTEM LOG START]");

  const hackTimer = setInterval(() => {
    currentPercent++;
    
    bar.style.width = currentPercent + "%";
    text.textContent = "HACKING BY ADITYA... " + currentPercent + "%";

    if (currentPercent % 7 === 0 && terminalLogs.length > 0) {
      appendLogLine(terminalLogs.shift());
    }

    if (currentPercent >= 40) {
      clearInterval(hackTimer);
      
      appendLogLine("\n----------------------------------------");
      appendLogLine("[!] OVERRIDE HALTED AT 40%");
      appendLogLine("[!] PROCESS STOPPED BY AUTHOR.");
      appendLogLine("----------------------------------------");

      setTimeout(() => {
        overlay.style.display = "none";
        add("YOU CAN LEAVE NOW MY WORK IS DONE-By Aditya", "bot", true);
      }, 1500);
    }
  }, 100);
}
</script>

</body>
</html>
